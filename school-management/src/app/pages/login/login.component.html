<h2 style="text-align: center; font-size: 2rem; margin-bottom: 20px; color: #007bff;">Login Page</h2>

<form (ngSubmit)="loginUser()" style="max-width: 400px; margin: 0 auto; padding: 20px; background-color: #f8f9fa; 
      border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
  
  <div style="margin-bottom: 15px;">
    <input [(ngModel)]="user.email" name="email" placeholder="Email" required 
           style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; 
                  outline: none; transition: border-color 0.3s; margin-bottom: 10px;">
  </div>
  
  <div style="margin-bottom: 20px;">
    <input [(ngModel)]="user.password" name="password" type="password" placeholder="Password" required 
           style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; 
                  outline: none; transition: border-color 0.3s;">
  </div>
  
  <div style="text-align: center;">
    <button type="submit" style="width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; 
                                border-radius: 5px; font-size: 1.2rem; cursor: pointer; transition: background-color 0.3s;">
      Login
    </button>
  </div>
  
  <p style="text-align: center; margin-top: 20px; font-size: 1rem; color: #555;">
    Don't have an account? 
    <a routerLink="/register" style="color: #007bff; text-decoration: none; font-weight: bold;">Register here</a>
  </p>
</form>
